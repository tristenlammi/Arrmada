# Arrmada with plain Docker Compose: no installer, no git. In an empty folder:
#
#   curl -fsSL https://raw.githubusercontent.com/tristenlammi/Arrmada/main/docker-compose.example.yml -o docker-compose.yml
#
# put a .env file next to it with your two folders (full paths), and anything else marked
# ← that you want to change (each has its default after :-, which applies when it's unset):
#
#   ARRMADA_DATA_HOST=/srv/arrmada/data       Arrmada's database and settings
#   ARRMADA_STORAGE_HOST=/srv/media           your libraries and downloads (/storage inside)
#
# (Folders can also be written into this file in place of the defaults; .env is better, as
# a newer copy of the file then replaces this one without losing them.) Then
# `docker compose up -d` and open http://<server>:7878. The first-run setup in the browser
# takes care of the rest (TMDB key, library folders, Plex, indexers). API keys go there,
# never in this file or .env.
#
# Update:  docker compose pull && docker compose up -d
#
# Works as a Portainer stack too (Stacks → Add stack, paste this file or point it at the
# repository, and put the same lines under Environment variables). Use full paths there: a
# stack has no folder of its own, so a relative one would land inside Portainer's own volume.
#
# 64-bit Intel/AMD (x86-64) and 64-bit ARM (arm64) servers; every image here has both.
# Kept in step with the repository's
# docker-compose.yml (internal/archtest/compose_test.go checks the two agree).

x-you: &you
  PUID: "${ARRMADA_PUID:-1000}"   # ← the user that owns your media folder (Unraid: 99)
  PGID: "${ARRMADA_PGID:-1000}"   # ← its group (Unraid: 100)
  TZ: "${TZ:-Etc/UTC}"            # ← your timezone, e.g. Europe/London; schedules run on this clock

services:
  arrmada-app:
    image: ghcr.io/tristenlammi/arrmada:stable
    container_name: Arrmada-app
    # Lets x265 pin its threads; Convert works without it, just slower.
    cap_add: [SYS_NICE]
    ports:
      # ← the web page (ARRMADA_PORT); change it if 7878 is taken (Radarr)
      - "${ARRMADA_PORT:-7878}:7878"
      # audiobook server for listening apps (off until switched on)
      - "${ARRMADA_AUDIOBOOK_PORT:-13379}:13378"
    environment:
      <<: *you
      ARRMADA_AUDIOBOOK_HOST_PORT: "${ARRMADA_AUDIOBOOK_PORT:-13379}"
      ARRMADA_EXTERNAL_HEADER: "Cf-Connecting-Ip"
      ARRMADA_ALLOW_REMOTE_SETUP: "${ARRMADA_ALLOW_REMOTE_SETUP:-}"
      ARRMADA_TRUST_CF_HEADER: "${ARRMADA_TRUST_CF_HEADER:-}"
      ARRMADA_LOG_LEVEL: "info"
      ARRMADA_DATABASE_BACKEND: "${ARRMADA_DATABASE_BACKEND:-sqlite}"
      ARRMADA_POSTGRES_URL: "${ARRMADA_POSTGRES_URL:-}"
      ARRMADA_POSTGRES_SCHEMA: "${ARRMADA_POSTGRES_SCHEMA:-}"
      ARRMADA_POSTGRES_MAX_CONNECTIONS: "${ARRMADA_POSTGRES_MAX_CONNECTIONS:-4}"
      ARRMADA_QBITTORRENT_URL: "http://arrmada-qbittorrent:8080"
      ARRMADA_FLARESOLVERR_URL: "http://arrmada-flaresolverr:8191"
      ARRMADA_PROWLARR_URL: "http://arrmada-prowlarr:9696"
      ARRMADA_PROWLARR_HOST_PORT: "9696"
      ARRMADA_SABNZBD_URL: "http://arrmada-sabnzbd:8080"
      ARRMADA_SABNZBD_HOST_PORT: "8085"
      ARRMADA_QBIT_PORT: "${ARRMADA_QBIT_PORT:-6881}"
    volumes:
      # ← ARRMADA_DATA_HOST: where Arrmada keeps its database and settings (e.g.
      #   /mnt/user/appdata/arrmada/data on Unraid). Its own folder, never your media.
      - "${ARRMADA_DATA_HOST:-/path/to/arrmada/data}:/data"
      # ← ARRMADA_STORAGE_HOST: the folder that holds your libraries AND downloads (e.g.
      #   /mnt/user/data with media/movies, media/tv and torrents inside), so imports
      #   hardlink instead of copying. It's /storage inside: pick each library there during
      #   setup. Never mount media at /data — that's the database.
      - &media "${ARRMADA_STORAGE_HOST:-/path/to/your/media}:/storage"
      # Arrmada's own managed media: a Docker volume, or ARRMADA_MEDIA_HOST's folder.
      - "${ARRMADA_MEDIA_HOST:-arrmada-media}:/media"
      # The optional SABnzbd's settings (below), read-only: Arrmada reads its API key here.
      - arrmada-sab-config:/bundled/sabnzbd:ro
    # To use an Intel/AMD GPU for Convert, uncomment (x86-64 only; ARM uses the CPU).
    # NVIDIA: docs/gpu.md.
    # devices: [/dev/dri:/dev/dri]
    depends_on:
      arrmada-media-init: { condition: service_completed_successfully }
      arrmada-qbittorrent: { condition: service_started }
      arrmada-flaresolverr: { condition: service_started }
    restart: unless-stopped

  # The download client, already wired up: on its first start Arrmada gives it a password
  # (an admin sees it on its card in Settings → Connections) and sets its folders.
  arrmada-qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3
    container_name: Arrmada-qbittorrent
    environment:
      <<: *you
      WEBUI_PORT: "8080"
    volumes:
      - arrmada-qbt-config:/config
      - *media
      - "${ARRMADA_MEDIA_HOST:-arrmada-media}:/media"
    ports:
      # ← BitTorrent (ARRMADA_QBIT_PORT); forward it on your router (TCP and UDP). Arrmada
      # sets the same port inside qBittorrent.
      - "${ARRMADA_QBIT_PORT:-6881}:${ARRMADA_QBIT_PORT:-6881}"
      - "${ARRMADA_QBIT_PORT:-6881}:${ARRMADA_QBIT_PORT:-6881}/udp"
      # qBittorrent's own web page isn't needed (Arrmada drives it); to peek, add
      # - "8080:8080"
      # and sign in with the login on its card in Settings → Connections.
    depends_on:
      arrmada-qbittorrent-init: { condition: service_completed_successfully }
      arrmada-media-init: { condition: service_completed_successfully }
    restart: unless-stopped

  # Gets past Cloudflare on trackers that use it. No port published.
  arrmada-flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: Arrmada-flaresolverr
    environment:
      <<: *you
      LOG_LEVEL: "info"
    restart: unless-stopped

  # One-shot: Arrmada's own downloads/library folders, owned by the user above. The managed
  # volume (told apart by what's really mounted) also gets a starting folder per library, and
  # all of it is the user's; any other folder keeps its owners, gets no library folders, and
  # only the folders made here are handed over. Same script as docker-compose.yml's.
  arrmada-media-init:
    image: alpine:3.20
    container_name: Arrmada-media-init
    environment:
      <<: *you
      MEDIA_HOST: "${ARRMADA_MEDIA_HOST:-}"
    command:
      - sh
      - -c
      - |
        case "$$MEDIA_HOST" in
          . | ./* | .. | ../*)
            echo "ARRMADA_MEDIA_HOST=$$MEDIA_HOST is a relative path. Give the full path in .env: a relative one would be inside Arrmada's own folder." >&2
            exit 1 ;;
        esac
        m=$$(awk '$$5 == "/media" { print $$3, $$4 }' /proc/self/mountinfo | tail -n 1)
        d=$$(awk '$$5 == "/data" { print $$3, $$4 }' /proc/self/mountinfo | tail -n 1)
        mr=$${m#* }; mr=$${mr%/}; dr=$${d#* }; dr=$${dr%/}; overlap=""
        if [ -n "$$m" ] && [ -n "$$d" ] && [ "$${m%% *}" = "$${d%% *}" ]; then
          case "$$mr/" in "$$dr/"*) overlap=1 ;; esac
          case "$$dr/" in "$$mr/"*) overlap=1 ;; esac
        fi
        if [ -n "$$overlap" ]; then
          echo "The media folder and the database's folder overlap (ARRMADA_MEDIA_HOST, ARRMADA_DATA_HOST). Media never goes in the database's folder: point ARRMADA_MEDIA_HOST at another one in .env." >&2
          exit 1
        fi
        if printf '%s\n' "$$mr" | grep -Eq '/volumes/[^/]+/_data$$'; then
          mkdir -p /media/downloads/incomplete /media/library/movies /media/library/tvshows \
            /media/library/ebooks /media/library/audiobooks /media/library/music &&
            chown -R "$$PUID:$$PGID" /media
          exit
        fi
        [ -n "$$(ls -A /media)" ] || chown "$$PUID:$$PGID" /media
        for p in /media/downloads /media/downloads/incomplete /media/library; do
          [ -d "$$p" ] || { mkdir "$$p" && chown "$$PUID:$$PGID" "$$p"; } || exit 1
        done
    volumes:
      - "${ARRMADA_MEDIA_HOST:-arrmada-media}:/media"
      - "${ARRMADA_DATA_HOST:-/path/to/arrmada/data}:/data:ro"
    restart: "no"

  # One-shot: qBittorrent's first settings (only if it has none yet). The whitelist, this
  # stack's own Docker network and nothing else (never your home network), lets Arrmada in
  # on its first start, when it gives qBittorrent a password and switches it off.
  arrmada-qbittorrent-init:
    image: alpine:3.20
    container_name: Arrmada-qbittorrent-init
    command:
      - sh
      - -c
      - |
        f=/config/qBittorrent/qBittorrent.conf
        [ -f "$$f" ] && exit 0
        mkdir -p /config/qBittorrent
        cat > "$$f" <<'EOF'
        [Application]
        FileLogger\Enabled=true

        [BitTorrent]
        Session\DefaultSavePath=/media/downloads
        Session\TempPath=/media/downloads/incomplete
        Session\TempPathEnabled=true
        Session\BTProtocol=TCP

        [LegalNotice]
        Accepted=true

        [Preferences]
        WebUI\Port=8080
        WebUI\Address=*
        WebUI\LocalHostAuth=true
        WebUI\CSRFProtection=true
        WebUI\HostHeaderValidation=false
        EOF
        n=$$(ip -4 route show 2>/dev/null | awk '/ scope link / && $$1 ~ /\// { printf "%s%s", sep, $$1; sep = ", " }')
        if [ -n "$$n" ]; then
          printf 'WebUI\\AuthSubnetWhitelistEnabled=true\nWebUI\\AuthSubnetWhitelist=%s\n' "$$n" >> "$$f"
        fi
    volumes:
      - arrmada-qbt-config:/config
    restart: "no"

  # Optional: Prowlarr, to manage indexers in one place ("Sync from Prowlarr" in Arrmada).
  # arrmada-prowlarr:
  #   image: lscr.io/linuxserver/prowlarr:2.6.5
  #   container_name: Arrmada-prowlarr
  #   environment: *you
  #   volumes:
  #     - arrmada-prowlarr-config:/config
  #   ports:
  #     - "9696:9696"
  #   restart: unless-stopped

  # Optional: SABnzbd, for Usenet. You need your own Usenet provider and Newznab indexers.
  # Uncomment both services; Arrmada adds SABnzbd by itself. Then open
  # http://<server>:8085 → Config → Servers to add your provider (sign in with the login an
  # admin sees on SABnzbd's card in Settings → Connections), and add your indexers in Arrmada.
  # arrmada-sabnzbd:
  #   image: lscr.io/linuxserver/sabnzbd:5.1.3
  #   container_name: Arrmada-sabnzbd
  #   environment: *you
  #   volumes:
  #     - arrmada-sab-config:/config
  #     - *media
  #     - "${ARRMADA_MEDIA_HOST:-arrmada-media}:/media"
  #   ports:
  #     - "8085:8080"
  #   depends_on:
  #     arrmada-sabnzbd-init: { condition: service_completed_successfully }
  #     arrmada-media-init: { condition: service_completed_successfully }
  #   restart: unless-stopped
  #
  # # One-shot: SABnzbd's first settings (only if it has none yet), with a new API key and
  # # a login for its own page.
  # arrmada-sabnzbd-init:
  #   image: alpine:3.20
  #   container_name: Arrmada-sabnzbd-init
  #   environment: *you
  #   command:
  #     - sh
  #     - -c
  #     - |
  #       f=/config/sabnzbd.ini
  #       [ -f "$$f" ] && exit 0
  #       key=$$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
  #       nzb=$$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
  #       pw=$$(od -An -N18 -tx1 /dev/urandom | tr -d ' \n')
  #       [ "$${#key}" = 32 ] && [ "$${#nzb}" = 32 ] && [ "$${#pw}" = 36 ] || exit 1
  #       umask 077
  #       cat > "$$f.new" <<EOF
