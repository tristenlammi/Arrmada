name: Image

# Builds the Docker image the way update.sh does on the owner's server, without
# publishing it. A broken apt repository, whisper.cpp tag or oneAPI base image then
# fails here, on the PR, instead of half-way through an update on the server.
# Stable release publishing is release.yml's job, only for a pushed v* tag.
# test-image.yml can separately publish commit-specific test tags on manual request.
#
# Both platforms a release publishes are built: amd64 on the usual runner and arm64
# natively on GitHub's arm64 runner (no emulation), so an ARM-only break shows up on the
# PR too, and a release finds both caches warm.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per ref; a newer push cancels the older run.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # amd64 keeps the check name it always had, in case a branch rule requires it.
    name: ${{ matrix.arch == 'amd64' && 'Docker build' || 'Docker build (arm64)' }}
    strategy:
      # An arm64 failure shouldn't hide whether amd64 builds, or the other way round.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            # The default cache scope, which amd64 has always used (release.yml reads it).
            cache-from: type=gha
            cache-to: type=gha,mode=max
          # arm64 writes its cache from main only (the build step leaves cache-to empty on
          # a pull request), so PR builds don't fill GitHub's cache with a second
          # platform's layers; they still read main's.
          - arch: arm64
            runner: ubuntu-24.04-arm
            cache-from: type=gha,scope=arm64
            cache-to: type=gha,mode=max,scope=arm64
    runs-on: ${{ matrix.runner }}
    # A cold amd64 build compiles whisper.cpp twice (Vulkan, and SYCL with Intel's
    # compiler); arm64 compiles one CPU-only build.
    timeout-minutes: 180
    steps:
      # The oneAPI build stage pulls a very large Intel base image; the runner's ~14 GB of
      # free disk isn't enough for it plus the rest. This clears the preinstalled SDKs
      # the build doesn't use. The arm64 build has no oneAPI stage.
      - name: Free disk space
        if: matrix.arch == 'amd64'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Load only into this disposable runner for the PostgreSQL smoke test. No
      # registry login or push occurs. Cached layers mean Go/web-only changes
      # code skips the whisper and oneAPI stages.
      - name: Build (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          # No platforms: each runner builds its own, natively, and amd64 keeps its
          # default cache scope.
          push: false
          load: true
          tags: arrmada-ci:postgres
          cache-from: ${{ matrix.cache-from }}
          cache-to: ${{ (matrix.arch != 'arm64' || github.event_name != 'pull_request') && matrix.cache-to || '' }}
          build-args: |
            VERSION=${{ github.head_ref || github.ref_name }}-${{ github.sha }}
            COMMIT=${{ github.sha }}
      - name: PostgreSQL startup, backup and offline recovery in the built image
        run: sh scripts/test-postgres-image.sh arrmada-ci:postgres

  # The Unraid all-in-one variant (the Dockerfile's aio target), which release.yml
  # publishes as the -aio tags: a pinned download that moved or a checksum that no longer
  # matches fails here rather than in a release. A job of its own, so it never turns the
  # plain image's check red. It runs after that build, whose cache then holds every plain
  # stage, so only the aio stages are built here.
  aio:
    name: ${{ matrix.arch == 'amd64' && 'Docker build (Unraid all-in-one)' || 'Docker build (Unraid all-in-one, arm64)' }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            cache-from: |
              type=gha
              type=gha,scope=aio
            cache-to: type=gha,mode=max,scope=aio
          - arch: arm64
            runner: ubuntu-24.04-arm
            cache-from: |
              type=gha,scope=arm64
              type=gha,scope=aio-arm64
            cache-to: type=gha,mode=max,scope=aio-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      # The plain image's layers come out of the cache onto the runner's disk too.
      - name: Free disk space
        if: matrix.arch == 'amd64'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Same build arguments as the plain build, so its cached layers match.
      - name: Build the all-in-one image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: aio
          push: false
          load: true
          tags: arrmada-ci:postgres-aio
          cache-from: ${{ matrix.cache-from }}
          # arm64 writes from main only, like the plain build above.
          cache-to: ${{ (matrix.arch != 'arm64' || github.event_name != 'pull_request') && matrix.cache-to || '' }}
          build-args: |
            VERSION=${{ github.head_ref || github.ref_name }}-${{ github.sha }}
            COMMIT=${{ github.sha }}
      - name: PostgreSQL startup, backup and offline recovery in the all-in-one image
        run: sh scripts/test-postgres-image.sh arrmada-ci:postgres-aio
