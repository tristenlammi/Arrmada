name: Publish test image

# Deliberately separate from PR validation and releases. Only an explicit manual
# request can publish, and only under a commit-specific test tag in this repo
# owner's registry namespace. No GitHub release or stable/latest tag is created.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA with successful CI and Image validation runs
        required: true
        type: string

concurrency:
  group: publish-test-image-${{ inputs.commit }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Verify source commit passed validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      image: ${{ steps.source.outputs.image }}
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Require successful CI and image checks for the exact source
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Supply a full lowercase commit SHA'; exit 1; }
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_COMMIT&per_page=100")"
          for workflow in ci.yml image.yml; do
            conclusion="$(jq -r --arg path ".github/workflows/$workflow" '[.workflow_runs[] | select(.path == $path)][0].conclusion // "missing"' <<< "$runs")"
            if [[ "$conclusion" != success ]]; then
              echo "$workflow must have a successful latest run for $SOURCE_COMMIT (found $conclusion)"
              exit 1
            fi
          done
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "image=ghcr.io/$owner/arrmada"
            echo "tag=test-$SOURCE_COMMIT"
            echo "commit=$SOURCE_COMMIT"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Test and publish ${{ matrix.arch }} image
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            cache: type=gha
          - arch: arm64
            runner: ubuntu-24.04-arm
            cache: type=gha,scope=arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space for the amd64 oneAPI stages
        if: matrix.arch == 'amd64'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build the exact source locally before publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          target: plain
          push: false
          load: true
          tags: arrmada-test:local
          cache-from: ${{ matrix.cache }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.tag }}
            COMMIT=${{ needs.prepare.outputs.commit }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}
            org.opencontainers.image.description=Experimental PostgreSQL test build; not a stable release
      - name: Verify startup, automatic schema creation, native backup and recovery
        run: sh scripts/test-postgres-image.sh arrmada-test:local
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push only the smoke-tested local image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          ref="$IMAGE:$TAG-$ARCH"
          docker tag arrmada-test:local "$ref"
          docker push "$ref"
          digest="$(docker image inspect "$ref" --format '{{json .RepoDigests}}' | jq -er --arg prefix "$IMAGE@sha256:" '.[] | select(startswith($prefix))')"
          [[ "$digest" =~ @sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/test-image-digests"
          printf '%s\n' "$digest" > "$RUNNER_TEMP/test-image-digests/$ARCH.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: test-image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/test-image-digests/*.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the verified multi-platform test tag
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: test-image-digest-*
          path: ${{ runner.temp }}/test-image-digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and verify the commit-specific test tag
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            digest="$(cat "$RUNNER_TEMP/test-image-digests/$arch.txt")"
            [[ "$digest" == "$IMAGE"@sha256:* && "$digest" =~ @sha256:[0-9a-f]{64}$ ]]
            sources+=("$digest")
          done
          ref="$IMAGE:$TAG"
          docker buildx imagetools create --tag "$ref" "${sources[@]}"
          docker buildx imagetools inspect "$ref"
          platforms="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r '[.manifests[].platform | select(.os == "linux") | .architecture] | sort | unique | join(",")')"
          [[ "$platforms" == amd64,arm64 ]]
          digest="$(docker buildx imagetools inspect "$ref" | awk '$1 == "Digest:" {print $2; exit}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo '### Experimental Arrmada image'
            echo "Source commit: \`$SOURCE_COMMIT\`"
            echo "Platforms: \`$platforms\`"
            echo "Tag: \`$ref\`"
            echo "Pin for deployment: \`$IMAGE@$digest\`"
            echo 'No stable/latest tags or GitHub releases were changed.'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$IMAGE@$digest" > "$RUNNER_TEMP/test-image-reference.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: test-image-reference
          path: ${{ runner.temp }}/test-image-reference.txt
          if-no-files-found: error
          retention-days: 30
