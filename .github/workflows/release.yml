name: Release

# Publishes a release: builds the image from a version tag, pushes it to GitHub's
# container registry (ghcr.io/<owner>/arrmada) and then writes the GitHub release with
# generated notes, which is what the app's "Update available" check reads.
#
# Only a pushed v* tag publishes (git tag v0.17.0 && git push origin v0.17.0). Pushes to
# main and pull requests never do: image.yml builds those without pushing anything. A
# manual run is only accepted when it's started on a v* tag, for re-publishing one.
#
# Two platforms under the same tags: linux/amd64 and linux/arm64 (Raspberry Pi 4/5 on a
# 64-bit OS, ARM NAS boxes, Apple Silicon). Each is built natively on its own runner —
# arm64 on GitHub's arm64 runner, not under emulation, which would take hours over the
# whisper.cpp compile — and pushed by digest only, with no tag. Then one job joins the two
# into a single multi-platform tag set, so `docker pull ...:stable` picks the right one
# by itself, and nothing is tagged unless both platforms built.
#
# Nothing secret goes into the image. It's built from the repository alone, with the tag
# and commit as its only build arguments; keys are entered in the app after install.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One run per tag, and a second push of the same tag waits rather than racing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: Build the image (${{ matrix.arch }})
    # A manual run started on a branch publishes nothing.
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      # One platform failing stops the other: a release is both or neither.
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            # amd64 reads the cache image.yml writes on main under its default scope, as
            # it always has; arm64 has a scope of its own.
            cache: type=gha
          - arch: arm64
            runner: ubuntu-24.04-arm
            cache: type=gha,scope=arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      # Same as image.yml: the oneAPI stage (amd64 only) needs more disk than the runner
      # has free. The arm64 build doesn't pull Intel's image.
      - name: Free disk space
        if: matrix.arch == 'amd64'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6  # v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v7
      # Registry paths must be lower case; the owner's name is used as GitHub has it.
      # COMMIT is the short commit, as update.sh stamps a local build.
      - name: Names
        id: names
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/arrmada" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Only the labels are used here (the tags are written once, by the merge job); the
      # tag list is the merge job's, so org.opencontainers.image.version reads 0.17.0 as
      # it always has.
      - name: Image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=sha,prefix=sha-,format=short
            type=raw,value=stable,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Arrmada
            org.opencontainers.image.description=Self-hosted movies, series, books and music in one app
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub's container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # VERSION is the tag (v0.17.0), so the Dashboard and the update check read it as a
      # release. The cache from main's image.yml runs is read, not written: a tag's own
      # cache entries would only ever be used by that tag. Pushed by digest: the image is
      # in the registry but no tag points at it until the merge job below.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # No platforms: each runner builds its own, natively (the merge job checks both
          # arrived), each reading the cache image.yml wrote for it on main.
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.names.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: ${{ matrix.cache }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.names.outputs.commit }}
      - name: Keep the digest for the merge job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          # Kept a week, so a merge job that failed can still be re-run days later.
          retention-days: 7

  merge:
    name: Tag the release image (amd64 + arm64)
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Names
        id: names
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/arrmada" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      # Tags: 0.17.0, 0.17, sha-abc1234, and stable for a release that isn't a pre-release
      # (v0.18.0-rc.1 gets its own version and sha tags only). No "latest": installs pick
      # stable or a version on purpose. The semver tags name their value so a manual
      # re-run on a tag gets them too. Keep this list the same as the build job's.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=sha,prefix=sha-,format=short
            type=raw,value=stable,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub's container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One multi-platform index per tag, pointing at the two images built above. Docker
      # on each machine pulls the one for its platform.
      - name: Create the multi-platform tags
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.names.outputs.image }}
        run: |
          digests=(*)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "Expected one digest per platform (2), found: ${digests[*]}" >&2
            exit 1
          fi
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          for digest in "${digests[@]}"; do args+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${args[@]}"
      # Fails the release (before the GitHub release is written) unless both platforms are
      # really behind the version tag.
      - name: Check both platforms are published
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          platforms="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | select(.os == "linux") | .architecture] | sort | unique | join(",")')"
          echo "Platforms: ${platforms}"
          [ "${platforms}" = "amd64,arm64" ]

  notes:
    name: GitHub release
    # After the image is tagged, so "Update available" never points at an image that
    # can't be pulled yet.
    needs: merge
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # A release made by hand in GitHub's UI (which also pushes the tag) is left as it
      # is; otherwise one is created with GitHub's generated notes. A tag with a hyphen
      # (v0.18.0-rc.1) is marked a pre-release, which the update check doesn't offer.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it as it is."
            exit 0
          fi
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          # shellcheck disable=SC2086
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG" $pre

  # The Unraid all-in-one variant (the Dockerfile's aio target: Arrmada plus a qBittorrent
  # and a FlareSolverr in one container, for the Community Apps template). It's built on
  # top of the plain image this release just pushed, by digest (the build context named
  # "arrmada" replaces that Dockerfile stage), so it carries exactly the same Arrmada, and
  # tagged x.y.z-aio, x.y-aio, sha-…-aio and stable-aio in the same repository.
  #
  # It never holds the plain release back: the jobs above don't wait for it, so a failure
  # here leaves the release and its notes published (the run shows red) and the -aio tags
  # where they were; Unraid users simply see the update a little later. Its tags are only
  # written once the plain image's are, so stable-aio never runs ahead of stable.
  aio:
    name: Build the Unraid all-in-one image (${{ matrix.arch }})
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: true
      matrix:
        include:
          # The cache image.yml's all-in-one job writes on main.
          - arch: amd64
            runner: ubuntu-24.04
            cache: type=gha,scope=aio
          - arch: arm64
            runner: ubuntu-24.04-arm
            cache: type=gha,scope=aio-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Names
        id: names
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/arrmada" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # The plain image's digest for this platform, from the build job above.
      - uses: actions/download-artifact@v8
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/plain
      - name: Plain image digest
        id: plain
        run: |
          digests=("${RUNNER_TEMP}"/plain/*)
          if [ "${#digests[@]}" -ne 1 ]; then
            echo "Expected one plain-image digest, found: ${digests[*]}" >&2
            exit 1
          fi
          echo "digest=sha256:$(basename "${digests[0]}")" >> "$GITHUB_OUTPUT"
      - name: Image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }},suffix=-aio
          labels: |
            org.opencontainers.image.title=Arrmada (all-in-one)
            org.opencontainers.image.description=Arrmada with qBittorrent and FlareSolverr built in, for Unraid
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub's container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The cache only serves the aio stages' downloads; the plain image comes from the
      # registry, by digest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: aio
          build-contexts: |
            arrmada=docker-image://${{ steps.names.outputs.image }}@${{ steps.plain.outputs.digest }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.names.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: ${{ matrix.cache }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.names.outputs.commit }}
      # Named aio-digests-*, so the plain merge job's digests-* never picks these up.
      - name: Keep the digest for the merge job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: aio-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          # A week, like the plain digests, so a failed merge can be re-run days later.
          retention-days: 7

  aio-merge:
    name: Tag the all-in-one image (amd64 + arm64)
    # After the plain image's tags, so stable-aio is never newer than stable.
    needs: [aio, merge]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Names
        id: names
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/arrmada" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: aio-digests-*
          merge-multiple: true
      # The plain image's tag list with -aio on the end of each: 0.17.0-aio, 0.17-aio,
      # sha-abc1234-aio, and stable-aio for a release that isn't a pre-release.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }},suffix=-aio
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }},suffix=-aio
            type=sha,prefix=sha-,suffix=-aio,format=short
            type=raw,value=stable,suffix=-aio,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub's container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-platform tags
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.names.outputs.image }}
        run: |
          digests=(*)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "Expected one digest per platform (2), found: ${digests[*]}" >&2
            exit 1
          fi
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # Every tag must end in -aio: one without would overwrite the plain image's.
          for tag in "${tags[@]}"; do
            case "$tag" in
              *-aio) ;;
              *) echo "Refusing to write ${tag}: not an -aio tag" >&2; exit 1 ;;
            esac
          done
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          for digest in "${digests[@]}"; do args+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${args[@]}"
      - name: Check both platforms are published
        run: |
          tag="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          docker buildx imagetools inspect "${tag}"
          platforms="$(docker buildx imagetools inspect "${tag}" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | select(.os == "linux") | .architecture] | sort | unique | join(",")')"
          echo "Platforms: ${platforms}"
          [ "${platforms}" = "amd64,arm64" ]
