name: CI

# Guards every push and PR to main: the Go module must build, vet clean, and pass
# its full test suite; the embedded web UI must lint (errors only), pass its unit
# tests, type-check, build and pass its browser smoke tests; the install and update
# scripts must pass shellcheck; and no known vulnerability may be reachable from our Go
# code (govulncheck) or sit in the UI's production dependencies at high or critical
# (npm audit).
# This is the net under all future changes — nothing merges red.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per ref; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The token only reads the code: no job pushes, comments or publishes. Caches and the
# Playwright report upload use the Actions runtime, not this token. A job that ever
# needs more gets it at job level.
permissions:
  contents: read

# Runners are pinned to ubuntu-24.04 rather than ubuntu-latest, which moved to Ubuntu 26
# on 2026-10-19: a new OS image should be a change made on purpose here, not a surprise
# red build. Actions are on their Node 24 majors (Node 20 actions are deprecated).
env:
  # Keep in step with the Dockerfile's web stage (FROM node:24-alpine), so CI checks
  # the UI with the same Node major that builds the shipped image.
  NODE_VERSION: "24"

jobs:
  go:
    name: Go build, vet & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The binary embeds the built web UI (//go:embed all:dist in internal/webui), and
      # dist is generated rather than committed. Without this step the embed pattern
      # matches nothing on a fresh checkout and `go build ./...` fails before any of the
      # real checks run — which is exactly what happened: every run since this workflow
      # landed failed here, never reaching vet, gofmt or the tests.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the embedded web UI
        run: npm ci && npm run build
        working-directory: web
      # The newest 1.26 patch: without check-latest, setup-go takes whatever 1.26.x the
      # runner image has cached, which can be a patch behind on security fixes.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Gofmt (must be clean)
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: Test (race)
        # Runs as the non-root `runner` user, so tests that skip as root (permission
        # checks) run here and nowhere else. A fresh test store is a copy of one migrated
        # once per test binary (internal/store/testtemplate.go); before that, migrating
        # every store under -race put internal/httpapi past an hour on these runners. Now
        # the slowest package takes minutes; the limit is per package, not per test.
        # -json so the failures can be turned into annotations below: they show on the
        # run's page and in the API without signing in, where the job log needs a login.
        run: |
          set +e
          go test -race -timeout 60m -json ./... > go-test.json
          status=$?
          # The plain test output, as before.
          jq -rj 'select(.Action=="output") | .Output' go-test.json
          # One annotation per failing test, with its output (capped), one per package
          # that failed outside a test (a panic or timeout), and one per build failure.
          jq -rs '
            def esc: gsub("%";"%25") | gsub("\r";"") | gsub("\n";"%0A");
            def tesc: esc | gsub(":";"%3A") | gsub(",";"%2C");
            ([.[] | select(.Test != null)] | group_by(.Package + " " + .Test)
              | map(select(any(.[]; .Action == "fail")))
              | .[] | "::error title=" + ("FAIL " + .[0].Package + " " + .[0].Test | tesc) + "::"
                + ([.[] | select(.Action == "output") | .Output] | join("") | .[-3000:] | esc)),
            ([.[] | select(.Test == null)] | group_by(.Package)
              | map(select(any(.[]; .Action == "fail")))
              | .[] | "::error title=" + ("FAIL package " + .[0].Package | tesc) + "::"
                + ([.[] | select(.Action == "output") | .Output] | join("") | .[-3000:] | esc)),
            ([.[] | select(.ImportPath != null)] | group_by(.ImportPath)
              | map(select(any(.[]; .Action == "build-fail")))
              | .[] | "::error title=" + ("BUILD FAIL " + .[0].ImportPath | tesc) + "::"
                + ([.[] | select(.Action == "build-output") | .Output] | join("") | .[-3000:] | esc))
          ' go-test.json
          exit $status

  postgres:
    name: PostgreSQL ${{ matrix.postgres }} migrations and repository tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: arrmada-test-only
          POSTGRES_DB: arrmada_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true
      # Setup alone uses the disposable server's administrator. The tests create
      # restricted application roles with no superuser or database-create access.
      - name: Install native PostgreSQL clients
        # Match the server major, rather than Ubuntu's default client (which
        # cannot dump newer servers). Use PostgreSQL's signed apt repository.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-${{ matrix.postgres }}
      # HTTP API integration tests compile the embedded UI package. UI assets
      # themselves are built/tested in the web job; these tests exercise JSON
      # routes and use only a placeholder for go:embed.
      - name: Placeholder web UI for PostgreSQL HTTP API tests
        run: mkdir -p internal/webui/dist && echo '<!doctype html>' > internal/webui/dist/index.html
      - name: Build server for real PostgreSQL startup/shutdown smoke test
        run: go build -o /tmp/arrmada-postgres-test ./cmd/arrmada
      - name: Test PostgreSQL with restricted application roles (race)
        env:
          ARRMADA_TEST_POSTGRES_ADMIN_URL: postgres://postgres:arrmada-test-only@127.0.0.1:5432/arrmada_test?sslmode=disable
          ARRMADA_TEST_POSTGRES_BIN: /usr/lib/postgresql/${{ matrix.postgres }}/bin
          ARRMADA_TEST_BINARY: /tmp/arrmada-postgres-test
        run: go test -race -timeout 10m -count=1 ./internal/store -run 'Test(Postgres|Bind|DatabaseSQLiteBoundary)'
      - name: Enable certificate-verified TLS on the disposable test service
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost -addext subjectAltName=DNS:localhost -keyout /tmp/arrmada-test-server.key -out /tmp/arrmada-test-server.crt
          docker cp /tmp/arrmada-test-server.key "$POSTGRES_CONTAINER:/tmp/arrmada-test-server.key"
          docker cp /tmp/arrmada-test-server.crt "$POSTGRES_CONTAINER:/tmp/arrmada-test-server.crt"
          docker exec -u root "$POSTGRES_CONTAINER" chown postgres:postgres /tmp/arrmada-test-server.key /tmp/arrmada-test-server.crt
          docker exec -u root "$POSTGRES_CONTAINER" chmod 600 /tmp/arrmada-test-server.key
          docker exec -u postgres "$POSTGRES_CONTAINER" psql -U postgres -d arrmada_test -c "ALTER SYSTEM SET ssl_cert_file='/tmp/arrmada-test-server.crt'"
          docker exec -u postgres "$POSTGRES_CONTAINER" psql -U postgres -d arrmada_test -c "ALTER SYSTEM SET ssl_key_file='/tmp/arrmada-test-server.key'"
          docker exec -u postgres "$POSTGRES_CONTAINER" psql -U postgres -d arrmada_test -c "ALTER SYSTEM SET ssl=on"
          docker exec -u postgres "$POSTGRES_CONTAINER" psql -U postgres -d arrmada_test -c 'SELECT pg_reload_conf()'
          for _ in $(seq 1 20); do
            if /usr/lib/postgresql/${{ matrix.postgres }}/bin/psql 'postgres://postgres:arrmada-test-only@localhost:5432/arrmada_test?sslmode=verify-full&sslrootcert=/tmp/arrmada-test-server.crt' -c 'SELECT 1'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify Go/native TLS, certificate rejection and compressed recovery
        env:
          ARRMADA_TEST_POSTGRES_TLS_URL: postgres://postgres:arrmada-test-only@localhost:5432/arrmada_test?sslmode=verify-full&sslrootcert=/tmp/arrmada-test-server.crt
          ARRMADA_TEST_POSTGRES_BIN: /usr/lib/postgresql/${{ matrix.postgres }}/bin
        run: go test -race -timeout 5m -count=1 ./internal/store -run '^TestPostgresVerifiedTLSAndCompressedRecovery$'

  audit:
    name: Vulnerability scan (govulncheck, npm audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Same Go as the go job: govulncheck judges the standard library by the Go that runs it.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true
      # govulncheck type-checks every package, and internal/webui embeds the built UI
      # (//go:embed all:dist). A placeholder page satisfies the embed; no UI build needed.
      - name: Placeholder web UI for the embed
        run: mkdir -p internal/webui/dist && echo '<!doctype html>' > internal/webui/dist/index.html
      # Fails only when our code can actually reach a vulnerable function, in the standard
      # library or a module. Ones in code we only import are listed but don't fail the
      # run; upgrade those when convenient. It reads the live vulnerability database,
      # so a newly published Go advisory can turn this red with no change here: the fix is
      # the next Go patch (Dockerfile and setup-go) or a module upgrade.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Production dependencies only (what ships in the UI), high or critical. Dev-only
      # findings (test runner, build tools) don't fail CI; upgrade those deliberately.
      # npm audit reads the lockfile, so no install is needed.
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
        working-directory: web

  scripts:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # update.sh runs on the owner's server and has to survive a bad pull or a failed
      # build without leaving the app down; a quoting slip there is not caught anywhere
      # else. shellcheck is preinstalled on the runner image. -s sh: they are POSIX sh.
      - name: shellcheck
        run: shellcheck -s sh update.sh install.sh docker/entrypoint.sh scripts/changelog-section.sh scripts/test-postgres-image.sh

  web:
    name: Web build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      # Warnings are a visible backlog, not a failure; any lint error fails the job.
      - name: Lint (eslint)
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm test
      - name: Type-check
        run: npx tsc --noEmit -p .
      - name: Build (tsc --noEmit + vite)
        run: npm run build
      # Browser smoke tests (FE-10): the build above, served by vite preview, against a
      # mocked API. Chromium only, keyed on the pinned Playwright version so a cache hit
      # skips the ~150 MB download; its system libraries still come from apt.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: E2E smoke (Playwright)
        run: npm run e2e
        env:
          # The build step just ran; don't build a second time.
          E2E_NO_BUILD: "1"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
